name: Build LaTeX document
on:
  push:
    paths:
    - '**.tex'

jobs:
  build_latex:
    runs-on: ubuntu-latest
    outputs:
      time: ${{ steps.time.outputs.time }}
    steps:
    - uses: actions/checkout@v4

    - name: Cache LaTeX packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.texlive
          /usr/local/texlive
        key: texlive-${{ runner.os }}-${{ hashFiles('**/*.tex') }}
        restore-keys: |
          texlive-${{ runner.os }}-

    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@v4
      with:
        root_file: CV.tex

    - name: Get Time
      id: time
      run: echo "time=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDF
        path: CV.pdf
        retention-days: 7

  release:
    needs: build_latex
    runs-on: ubuntu-latest
    steps:
    - name: Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: PDF

    - name: Create Release and upload asset
      uses: softprops/action-gh-release@v2
      with:
        name: Resume compiled on ${{ needs.build_latex.outputs.time }}
        tag_name: ${{ needs.build_latex.outputs.time }}
        token: ${{ secrets.GITHUB_TOKEN }}
        files: CV.pdf

  convert_and_commit:
    needs: build_latex
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download PDF artifact
      uses: actions/download-artifact@v4
      with:
        name: PDF

    - name: Install poppler-utils
      run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

    - name: Convert PDF to PNG
      run: pdftoppm -r 225 -png -singlefile CV.pdf resume

    - name: Commit and push PNG
      run: |
        git config user.email "action[bot]@github.com"
        git config user.name "github-actions[bot]"
        git add resume.png
        git diff --cached --quiet || git commit -m "[bot] updated resume.png"
        git push
